apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stakeholder-demo-app-stg
  namespace: argocd
spec:
  project: demo
  source:
    repoURL: https://github.com/dsaisani-cisco/go-backend
    targetRevision: HEAD
    path: deploy/overlays/stg
    kustomize:
      images:
        - danny-app-test=localhost:5000/danny-app-test:1.0.0
  destination:
    server: https://kubernetes.default.svc
    namespace: stakeholder-demo-stg
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
