apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo
  namespace: argocd
spec:
  project: demo
  destination:
    namespace: kargo
    server: https://kubernetes.default.svc
  source:
    repoURL: ghcr.io/akuity/kargo-charts
    chart: kargo
    targetRevision: 1.12.4
    helm:
      parameters:
        - name: api.secret.name
          value: kargo-api
        # git and ssh in this image call OpenSSL ARM routines this minikube
        # node does not implement, so HTTPS clones die with SIGILL.
        - name: controller.env[0].name
          value: OPENSSL_armcap
        - name: controller.env[0].value
          value: "0"
          forceString: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true