apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-platform-demo
  namespace: argocd
spec:
  project: demo
  source:
    repoURL: https://github.com/dsaisani-cisco/deployments
    targetRevision: HEAD
    path: kargo/platform-demo
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
