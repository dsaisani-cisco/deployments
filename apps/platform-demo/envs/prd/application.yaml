apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-prd
  namespace: argocd
spec:
  project: platform-demo
  source:
    repoURL: https://github.com/dsaisani-cisco/deployments
    targetRevision: HEAD
    path: apps/platform-demo/envs/prd
  destination:
    name: platform-demo-prd
    namespace: platform-demo-prd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    managedNamespaceMetadata:
      annotations:
        argocd.argoproj.io/sync-wave: "1"