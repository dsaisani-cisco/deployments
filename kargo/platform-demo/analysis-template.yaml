apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: integration-test
  namespace: platform-demo
spec:
  metrics:
  - name: integration-test
    provider:
      job:
        spec:
          template:
            spec:
              containers:
              - name: now
                image: alpine:latest
                command: ["sh", "-c"]
                args:
                - |
                  wget -q -O - "http://demo-app.platform-demo-stg.svc.cluster.local:8081/now" | grep -q '"now"'
              restartPolicy: Never
          backoffLimit: 1