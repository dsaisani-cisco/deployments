apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: stg
  namespace: platform-demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: danny-app-test
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: gitRepo
          value: https://github.com/dsaisani-cisco/deployments
        - name: imageRepo
          value: 10.108.65.240/danny-app-test
        - name: overlay
          value: apps/platform-demo/envs/stg
        - name: argocdApp
          value: platform-demo-app-stg
      steps:
        # We need to set the promotion actor to the current user so that the same user cannot then promote to production
        - uses: set-metadata
          config:
            updates:
            - kind: Freight
              name: ${{ ctx.targetFreight.name }}
              values:
                promotedToStgBy: ${{ ctx.meta.promotion.actor }}
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitRepo }}
            checkout:
              - branch: main
                path: ./repo
        - uses: kustomize-set-image
          as: update-image
          config:
            path: ./repo/${{ vars.overlay }}
            images:
              - image: danny-app-test
                newName: localhost:5000/danny-app-test
                tag: ${{ imageFrom(vars.imageRepo).Tag }}
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: ${{ outputs['update-image'].commitMessage }}
        - uses: git-push
          config:
            path: ./repo
        - uses: argocd-update
          config:
            apps:
              - name: ${{ vars.argocdApp }}
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.gitRepo }}
                    desiredRevision: ${{ outputs.commit.commit }}
  verification:
    analysisTemplates:
      - name: integration-test
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: test
  namespace: platform-demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: danny-app-test
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: gitRepo
          value: https://github.com/dsaisani-cisco/deployments
        - name: imageRepo
          value: 10.108.65.240/danny-app-test
        - name: overlay
          value: apps/platform-demo/envs/test
        - name: argocdApp
          value: platform-demo-app-test
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitRepo }}
            checkout:
              - branch: main
                path: ./repo
        - uses: kustomize-set-image
          as: update-image
          config:
            path: ./repo/${{ vars.overlay }}
            images:
              - image: danny-app-test
                newName: localhost:5000/danny-app-test
                tag: ${{ imageFrom(vars.imageRepo).Tag }}
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: ${{ outputs['update-image'].commitMessage }}
        - uses: git-push
          config:
            path: ./repo
        - uses: argocd-update
          config:
            apps:
              - name: ${{ vars.argocdApp }}
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.gitRepo }}
                    desiredRevision: ${{ outputs.commit.commit }}
  verification:
    analysisTemplates:
      - name: health-check
    args:
      - name: service-url
        value: http://demo-app.platform-demo-test.svc.cluster.local:8081/healthz
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prd
  namespace: platform-demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: danny-app-test
      sources:
        availabilityStrategy: All
        stages:
          - stg
          - test
  promotionTemplate:
    spec:
      vars:
        - name: gitRepo
          value: https://github.com/dsaisani-cisco/deployments
        - name: imageRepo
          value: 10.108.65.240/danny-app-test
        - name: overlay
          value: apps/platform-demo/envs/prd
        - name: argocdApp
          value: platform-demo-app-prd
      steps:
        - uses: fail
          if: ${{ ctx.meta.promotion.actor == freightMetadata(ctx.targetFreight.name).promotedToStgBy }}
          config:
            message: ${{ ctx.meta.promotion.actor }} promoted this Freight to staging and cannot promote it to production
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitRepo }}
            checkout:
              - branch: main
                path: ./repo
        - uses: kustomize-set-image
          as: update-image
          config:
            path: ./repo/${{ vars.overlay }}
            images:
              - image: danny-app-test
                newName: localhost:5000/danny-app-test
                tag: ${{ imageFrom(vars.imageRepo).Tag }}
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: ${{ outputs['update-image'].commitMessage }}
        - uses: git-push
          config:
            path: ./repo
        - uses: argocd-update
          config:
            apps:
              - name: ${{ vars.argocdApp }}
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.gitRepo }}
                    desiredRevision: ${{ outputs.commit.commit }}
