apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: stg
  namespace: platform-demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: danny-app-test
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: gitRepo
          value: https://github.com/dsaisani-cisco/deployments
        - name: imageRepo
          value: 10.108.65.240/danny-app-test
        - name: overlay
          value: apps/platform-demo/envs/stg
        - name: argocdApp
          value: platform-demo-app-stg
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitRepo }}
            checkout:
              - branch: main
                path: ./repo
        - uses: kustomize-set-image
          as: update-image
          config:
            path: ./repo/${{ vars.overlay }}
            images:
              - image: danny-app-test
                newName: localhost:5000/danny-app-test
                tag: ${{ imageFrom(vars.imageRepo).Tag }}
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: ${{ outputs['update-image'].commitMessage }}
        - uses: git-push
          config:
            path: ./repo
        - uses: argocd-update
          config:
            apps:
              - name: ${{ vars.argocdApp }}
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.gitRepo }}
                    desiredRevision: ${{ outputs.commit.commit }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: prd
  namespace: platform-demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: danny-app-test
      sources:
        stages:
          - stg
  promotionTemplate:
    spec:
      vars:
        - name: gitRepo
          value: https://github.com/dsaisani-cisco/deployments
        - name: imageRepo
          value: 10.108.65.240/danny-app-test
        - name: overlay
          value: apps/platform-demo/envs/prd
        - name: argocdApp
          value: platform-demo-app-prd
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.gitRepo }}
            checkout:
              - branch: main
                path: ./repo
        - uses: kustomize-set-image
          as: update-image
          config:
            path: ./repo/${{ vars.overlay }}
            images:
              - image: danny-app-test
                newName: localhost:5000/danny-app-test
                tag: ${{ imageFrom(vars.imageRepo).Tag }}
        - uses: git-commit
          as: commit
          config:
            path: ./repo
            message: ${{ outputs['update-image'].commitMessage }}
        - uses: git-push
          config:
            path: ./repo
        - uses: argocd-update
          config:
            apps:
              - name: ${{ vars.argocdApp }}
                namespace: argocd
                sources:
                  - repoURL: ${{ vars.gitRepo }}
                    desiredRevision: ${{ outputs.commit.commit }}
