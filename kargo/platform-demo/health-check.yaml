apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: health-check
  namespace: platform-demo
spec:
  args:
  - name: service-url
  metrics:
  - name: health
    provider:
      job:
        spec:
          backoffLimit: 1
          template:
            spec:
              restartPolicy: Never
              containers:
              - name: health
                image: alpine:latest
                command: ["sh", "-c"]
                args:
                - |
                  wget -q -O - "{{args.service-url}}" | grep -q '"status":"ok"'
